<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emote Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh;
      background-color: #0e0e10;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; font-family: sans-serif;
    }
    #status {
      position: absolute; top: 10px; left: 10px;
      color: #00ff00; font-size: 14px; background: rgba(0,0,0,0.7);
      padding: 5px 10px; border-radius: 4px; z-index: 999;
    }
    #emote-container {
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.5s ease-in-out;
    }
    #emote-container.show {
      opacity: 1; animation: pulse 2.5s infinite ease-in-out;
    }
    #emote-img { width: 90vw; height: 90vh; object-fit: contain; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>

  <div id="status">Verbinde...</div>

  <div id="emote-container">
    <img id="emote-img" src="" alt="Emote">
  </div>

  <script>
    const CHANNEL_NAME = 'carlzon_official';
    const CHECK_INTERVAL = 3000;
    
    let ws = null;
    let emotePool = [];
    let lastDisplayedEmote = "";
    let pingInterval = null;

    const statusEl = document.getElementById('status');

    function connectToTwitch() {
      statusEl.innerText = "Verbinde mit #" + CHANNEL_NAME + "...";
      statusEl.style.color = "#ffff00";

      ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

      ws.onopen = () => {
        statusEl.innerText = "Verbunden mit #" + CHANNEL_NAME + "!";
        statusEl.style.color = "#00ff00";
        ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
        ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 90000));
        ws.send(`JOIN #${CHANNEL_NAME.toLowerCase()}`);

        // Alle 30 Sekunden PING an Twitch senden, um Abbrechen zu verhindern
        clearInterval(pingInterval);
        pingInterval = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send('PING :tmi.twitch.tv');
          }
        }, 30000);
      };

      ws.onmessage = (event) => {
        const message = event.data;

        if (message.startsWith('PING')) {
          ws.send('PONG :tmi.twitch.tv');
          return;
        }

        if (message.includes('PRIVMSG')) {
          // Offizielle Twitch Emotes
          const emoteMatch = message.match(/emotes=([^;]+)/);
          if (emoteMatch && emoteMatch[1] && emoteMatch[1] !== '') {
            const emoteEntries = emoteMatch[1].split('/');
            emoteEntries.forEach(entry => {
              const emoteId = entry.split(':')[0];
              if (emoteId) {
                emotePool.push(`https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/3.0`);
              }
            });
          }

          // Fallback Emotes
          const chatText = message.split(`PRIVMSG #${CHANNEL_NAME.toLowerCase()} :`)[1] || "";
          const globalEmotes = {
            'lul': '425618',
            'kappa': '25',
            'pogchamp': '305954156',
            'heyguys': '30259'
          };

          const words = chatText.toLowerCase().trim().split(' ');
          words.forEach(word => {
            if (globalEmotes[word]) {
              emotePool.push(`https://static-cdn.jtvnw.net/emoticons/v2/${globalEmotes[word]}/default/dark/3.0`);
            }
          });
        }
      };

      // Bei Verbindungsabbruch automatisch neu verbinden!
      ws.onclose = () => {
        statusEl.innerText = "Getrennt! Verbinde neu in 3s...";
        statusEl.style.color = "#ff0000";
        clearInterval(pingInterval);
        setTimeout(connectToTwitch, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function updateDisplay() {
      const container = document.getElementById('emote-container');
      const img = document.getElementById('emote-img');

      if (emotePool.length > 0) {
        const nextEmote = emotePool[emotePool.length - 1];
        emotePool = [];

        if (nextEmote !== lastDisplayedEmote) {
          lastDisplayedEmote = nextEmote;
          container.classList.remove('show');

          setTimeout(() => {
            img.src = lastDisplayedEmote;
            container.classList.add('show');
          }, 300);
        }
      }
    }

    // Starten
    connectToTwitch();
    setInterval(updateDisplay, CHECK_INTERVAL);
  </script>
</body>
</html>
