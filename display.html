<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emote Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh;
      background-color: #0e0e10;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; font-family: sans-serif;
    }
    #emote-container {
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.5s ease-in-out;
    }
    #emote-container.show {
      opacity: 1; animation: pulse 2.5s infinite ease-in-out;
    }
    #emote-img { width: 90vw; height: 90vh; object-fit: contain; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>

  <div id="emote-container">
    <img id="emote-img" src="" alt="Emote">
  </div>

  <script>
    const CHANNEL_NAME = 'carlzon_official';
    const CHECK_INTERVAL = 2000;
    
    let ws = null;
    let emotePool = [];
    let lastDisplayedEmote = "";
    let pingInterval = null;

    // Wörterbuch für Drittanbieter-Emotes (Wort -> Bild-URL)
    const thirdPartyEmotes = {};

    const GLOBAL_EMOTES = {
      'lul': '425618',
      'kappa': '25',
      'pogchamp': '305954156',
      'heyguys': '30259',
      'kreygasm': '41',
      'trihard': '120232',
      'notlikethis': '58765',
      'biblethump': '86'
    };

    // 1. Drittanbieter-Emotes laden (7TV & BTTV)
    async function loadThirdPartyEmotes() {
      try {
        // Helix/Twitch ID für den Kanal abfragen via Decapi (Hilfs-API für unauthentifizierte IDs)
        const idRes = await fetch(`https://decapi.me/twitch/id/${CHANNEL_NAME}`);
        const userId = (await idRes.text()).trim();

        if (userId && !isNaN(userId)) {
          // BTTV Channel Emotes
          fetch(`https://api.betterttv.net/3/cached/users/twitch/${userId}`)
            .then(res => res.json())
            .then(data => {
              const bttvList = [...(data.channelEmotes || []), ...(data.sharedEmotes || [])];
              bttvList.forEach(e => {
                thirdPartyEmotes[e.code] = `https://cdn.betterttv.net/emote/${e.id}/3x`;
              });
            }).catch(() => {});

          // 7TV Channel Emotes
          fetch(`https://7tv.io/v3/users/twitch/${userId}`)
            .then(res => res.json())
            .then(data => {
              if (data.emote_set && data.emote_set.emotes) {
                data.emote_set.emotes.forEach(e => {
                  thirdPartyEmotes[e.name] = `https://cdn.7tv.app/emote/${e.id}/4x.webp`;
                });
              }
            }).catch(() => {});
        }
      } catch (err) {
        // Stillschweigend fortfahren, falls API offline ist
      }
    }

    // 2. Twitch Websocket Verbindung
    function connectToTwitch() {
      ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

      ws.onopen = () => {
        ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
        ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 90000));
        ws.send(`JOIN #${CHANNEL_NAME.toLowerCase()}`);

        clearInterval(pingInterval);
        pingInterval = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send('PING :tmi.twitch.tv');
          }
        }, 30000);
      };

      ws.onmessage = (event) => {
        const message = event.data;

        if (message.startsWith('PING')) {
          ws.send('PONG :tmi.twitch.tv');
          return;
        }

        if (message.includes('PRIVMSG')) {
          // A) Offizielle Twitch-Metadata Tags
          const emoteMatch = message.match(/emotes=([^;]+)/);
          if (emoteMatch && emoteMatch[1] && emoteMatch[1].trim() !== '') {
            const emoteEntries = emoteMatch[1].split('/');
            emoteEntries.forEach(entry => {
              const emoteId = entry.split(':')[0];
              if (emoteId) {
                emotePool.push(`https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/3.0`);
              }
            });
          }

          // B) Text-Prüfung für BTTV, 7TV und Globale Emotes
          const chatParts = message.split(`PRIVMSG #${CHANNEL_NAME.toLowerCase()} :`);
          if (chatParts.length > 1) {
            const chatText = chatParts[1].trim();
            const words = chatText.split(/\s+/);

            words.forEach(word => {
              // Exakter Treffer für 7TV / BTTV (Case-sensitive)
              if (thirdPartyEmotes[word]) {
                emotePool.push(thirdPartyEmotes[word]);
              } 
              // Fallback für globale Twitch-Emotes (Kleingeschrieben)
              else if (GLOBAL_EMOTES[word.toLowerCase()]) {
                emotePool.push(`https://static-cdn.jtvnw.net/emoticons/v2/${GLOBAL_EMOTES[word.toLowerCase()]}/default/dark/3.0`);
              }
            });
          }
        }
      };

      ws.onclose = () => {
        clearInterval(pingInterval);
        setTimeout(connectToTwitch, 3000);
      };

      ws.onerror = () => { ws.close(); };
    }

    function updateDisplay() {
      const container = document.getElementById('emote-container');
      const img = document.getElementById('emote-img');

      if (emotePool.length > 0) {
        const nextEmote = emotePool[emotePool.length - 1];
        emotePool = [];

        if (nextEmote !== lastDisplayedEmote) {
          lastDisplayedEmote = nextEmote;
          container.classList.remove('show');

          setTimeout(() => {
            img.src = lastDisplayedEmote;
            container.classList.add('show');
          }, 300);
        }
      }
    }

    // Startablauf
    loadThirdPartyEmotes();
    connectToTwitch();
    setInterval(updateDisplay, CHECK_INTERVAL);
  </script>
</body>
</html>
