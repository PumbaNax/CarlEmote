<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Emote Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #0e0e10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #emote-container {
      width: 80vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    #emote-container.show {
      opacity: 1;
      animation: pulse 2.5s infinite ease-in-out;
    }

    #emote-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <div id="emote-container">
    <img id="emote-img" src="" alt="Emote">
  </div>

  <script>
    // === DEIN KANALNAME HIER KLEINGESCHRIEBEN EINTRAGEN ===
    const CHANNEL_NAME = 'carlzon_official'; 
    const INTERVAL_TIME = 10000; // 10 Sekunden

    let emotePool = [];

    // Verbinden mit dem Twitch Chat WebSocket
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

    ws.onopen = () => {
      console.log('WebSocket Verbunden!');
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 90000));
      ws.send(`JOIN #${CHANNEL_NAME.toLowerCase()}`);
    };

    ws.onmessage = (event) => {
      const message = event.data;

      if (message.startsWith('PING')) {
        ws.send('PONG :tmi.twitch.tv');
        return;
      }

      // Prüfen auf Emotes in Chat-Nachrichten
      if (message.includes('PRIVMSG')) {
        const emoteMatch = message.match(/emotes=([^;]+)/);
        if (emoteMatch && emoteMatch[1]) {
          const emoteEntries = emoteMatch[1].split('/');
          emoteEntries.forEach(entry => {
            const emoteId = entry.split(':')[0];
            if (emoteId) {
              const emoteUrl = `https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/3.0`;
              emotePool.push(emoteUrl);
            }
          });
        }
      }
    };

    function displayRandomEmote() {
      const container = document.getElementById('emote-container');
      const img = document.getElementById('emote-img');

      let selectedEmoteUrl = "";

      if (emotePool.length > 0) {
        // Ein Emote aus dem Chat-Speicher wählen
        const randomIndex = Math.floor(Math.random() * emotePool.length);
        selectedEmoteUrl = emotePool[randomIndex];
        emotePool = []; // Speicher nach Auswahl leeren
      } else {
        // Fallback: Test-Emote anzeigen, wenn kein Emote im Chat war
        selectedEmoteUrl = "https://static-cdn.jtvnw.net/emoticons/v2/emotesv2_dc2720d207f24090bdc6e26b1d44f6f2/default/dark/3.0";
      }

      container.classList.remove('show');

      setTimeout(() => {
        img.src = selectedEmoteUrl;
        container.classList.add('show');
      }, 500);
    }

    // Beim Laden sofort einmal ausführen und danach alle 30 Sekunden
    setTimeout(displayRandomEmote, 2000);
    setInterval(displayRandomEmote, INTERVAL_TIME);
  </script>
</body>
</html>
