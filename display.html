<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emote Display</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0e0e10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #emote-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    #emote-container.show {
      opacity: 1;
      animation: pulse 2.5s infinite ease-in-out;
    }

    #emote-img {
      width: 90vw;
      height: 90vh;
      object-fit: contain;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>

  <div id="emote-container">
    <img id="emote-img" src="" alt="Emote">
  </div>

  <script>
    const CHANNEL_NAME = 'pumbanax'; 
    const INTERVAL_TIME = 10000; // 10 Sekunden

    let emotePool = [];
    let lastDisplayedEmote = "";

    // Sichere WebSocket-Verbindung zu Twitch
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 90000));
      ws.send(`JOIN #${CHANNEL_NAME.toLowerCase()}`);
    };

    ws.onmessage = (event) => {
      const message = event.data;

      if (message.startsWith('PING')) {
        ws.send('PONG :tmi.twitch.tv');
        return;
      }

      if (message.includes('PRIVMSG')) {
        // 1. Offizielle Twitch-Emotes auslesen
        const emoteMatch = message.match(/emotes=([^;]+)/);
        if (emoteMatch && emoteMatch[1] && emoteMatch[1] !== '') {
          const emoteEntries = emoteMatch[1].split('/');
          emoteEntries.forEach(entry => {
            const emoteId = entry.split(':')[0];
            if (emoteId) {
              emotePool.push(`https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/3.0`);
            }
          });
        }

        // 2. Fallback für globale Namens-Emotes (z. B. LUL, Kappa)
        const chatText = message.split(`PRIVMSG #${CHANNEL_NAME.toLowerCase()} :`)[1] || "";
        const globalEmotes = {
          'lul': '425618',
          'kappa': '25',
          'pogchamp': '305954156',
          'heyguys': '30259',
          'kreygasm': '41',
          'trihard': '120232'
        };

        const words = chatText.toLowerCase().trim().split(' ');
        words.forEach(word => {
          if (globalEmotes[word]) {
            emotePool.push(`https://static-cdn.jtvnw.net/emoticons/v2/${globalEmotes[word]}/default/dark/3.0`);
          }
        });
      }
    };

    function displayRandomEmote() {
      const container = document.getElementById('emote-container');
      const img = document.getElementById('emote-img');

      if (emotePool.length > 0) {
        const randomIndex = Math.floor(Math.random() * emotePool.length);
        lastDisplayedEmote = emotePool[randomIndex];
        emotePool = []; 

        container.classList.remove('show');

        setTimeout(() => {
          img.src = lastDisplayedEmote;
          container.classList.add('show');
        }, 500);
      }
    }

    setInterval(displayRandomEmote, INTERVAL_TIME);
  </script>
</body>
</html>
